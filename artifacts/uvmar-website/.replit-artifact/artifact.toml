kind = "web"
previewPath = "/"
title = "UVMAR Clean Energy"
version = "1.0.0"
id = "artifacts/uvmar-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20453

[services.development]
run = "pnpm --filter @workspace/uvmar-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uvmar-website", "run", "build" ]
publicDir = "artifacts/uvmar-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20453"
BASE_PATH = "/"
